<style>
:root{
  --yellow:#F2C230; --yellow-deep:#E0AC12; --ink:#1B2430; --paper:#F6F4EC; --surface:#FFFFFF;
  --muted:#5E6570; --line:#DDD8C8; --chip:#F3F0E6;
  --red:#C8252C; --orange:#C2410C; --amber:#B7791F; --olive:#7A6212; --green:#2E7D4F;
  --soon-bg:#FFF4CC; --exp-bg:#FDE8E9; --miss-bg:#FFF6D6;
  --radius:10px;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Consolas,monospace;
  font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink); background:var(--paper);
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#16181D;--surface:#20242B;--ink:#ECEEF1;--muted:#A3A9B3;--line:#343944;--chip:#2A2F37;
        --soon-bg:#3A3212;--exp-bg:#3D1B1E;--miss-bg:#332B10;--green:#5CB883;
        --orange:#FB923C;--amber:#F2C230;--olive:#D9C06A;--red:#F26B70}
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--paper);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
body:not(.is-admin) .admin-only{display:none!important}

/* ---------- đầu trang vàng ---------- */
.mast{background:var(--yellow);color:#1B2430;border-bottom:5px solid #1B2430;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.mast-inner{max-width:1120px;margin:0 auto;padding:0 16px}
.mast-top{display:flex;align-items:center;gap:16px;padding:18px 0 18px}
.logo{flex:none;width:76px;height:76px;border-radius:50%;background:#FFFFFF;border:3px solid #1B2430;display:grid;place-items:center;cursor:pointer;padding:0}
.logo img{width:62px;height:auto;display:block}
.title{margin:0;padding:0;font-weight:800;letter-spacing:-.01em;line-height:1.05;
  font-size:clamp(1.55rem,6vw,3.6rem);color:#1B2430;cursor:pointer;background:none;border:0;text-align:left}
.searchbar .add-btn{flex:none;padding:0 22px;font-size:1.1rem;font-weight:700;border:2px solid #1B2430;border-radius:10px;
  background:#FFFFFF;color:#1B2430;cursor:pointer;white-space:nowrap}
.searchbar .add-btn:hover{background:#1B2430;color:var(--yellow)}
.searchbar{display:flex;gap:10px;padding-bottom:26px;max-width:880px}
.searchbar input{flex:1;min-width:0;padding:14px 18px;font-size:1.1rem;border:2px solid #1B2430;border-radius:10px;background:#FFFFFF;color:#1B2430}
.searchbar input::placeholder{color:#6B7280}
.searchbar button{padding:0 26px;font-size:1.1rem;font-weight:700;border:0;border-radius:10px;background:#1B2430;color:var(--yellow);cursor:pointer}
body:not(.page-home) .searchbar{display:none}
body:not(.page-home) .title{font-size:clamp(1.4rem,3.5vw,2rem)}
@media (max-width:520px){
  .mast-top{padding:14px 0 14px;gap:12px}
  .logo{width:56px;height:56px;border-width:2px}
  .logo img{width:46px}
  .searchbar{padding-bottom:18px;flex-wrap:wrap}
  .searchbar input{flex:1 1 100%;padding:12px 14px;font-size:1rem}
  .searchbar button,.searchbar .add-btn{flex:1;min-height:46px;padding:0 14px;font-size:1rem}
}

main{max-width:1120px;margin:0 auto;padding:26px 16px 72px}
h2{font-size:1.5rem;line-height:1.25;margin:0;font-weight:800}
.section{margin-bottom:38px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted)}
.back{background:none;border:0;padding:0;margin-bottom:14px;font-weight:600;color:var(--muted);cursor:pointer}
.back:hover{color:var(--ink)}

/* ---------- biển số ---------- */
.plate{display:inline-block;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;
  font-size:1.3rem;letter-spacing:.04em;line-height:1.3;white-space:nowrap;
  background:#FFFFFF;color:#101820;border:1px solid #101820;border-radius:5px;padding:1px 10px;
  box-shadow:inset 0 0 0 2px #FFFFFF, inset 0 0 0 3px #101820}
.plate.big{font-size:2.1rem;padding:2px 16px;border-radius:7px}

/* ---------- bảng tóm tắt theo hạng ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
@media (max-width:520px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}.sum{padding:8px 10px}.sum b{font-size:1.6rem}}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;text-align:left;cursor:pointer}
.sum b{display:block;font-size:1.9rem;line-height:1.1;font-weight:800}
.sum span{color:var(--muted);font-weight:500}
.sum.total{background:#1B2430;color:#fff;border-color:#1B2430}
.sum.total span{color:var(--yellow)}
.sum.h{border-top:5px solid var(--hc)}
.sum.h b{color:var(--hc)}
.hb{display:inline-block;background:var(--hc);color:#fff;border-radius:6px;padding:2px 8px;font-weight:700;font-size:.88rem;
  line-height:1.25;white-space:normal;text-align:center;max-width:100%;overflow-wrap:anywhere}
.sum[aria-pressed="true"]{outline:3px solid var(--yellow-deep);outline-offset:-3px}

/* ---------- mức cảnh báo ---------- */
.st{font-weight:600;white-space:nowrap}
.st.exp,.st.t10{color:var(--red)} .st.t20{color:var(--orange)} .st.t30{color:var(--amber)} .st.ok{color:var(--green)}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
@media (max-width:760px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tier{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--line);border-radius:var(--radius);
  padding:10px 14px;text-align:left;cursor:pointer}
.tier b{display:block;font-size:1.6rem;line-height:1.1}
.tier span{font-size:.9rem;color:var(--muted)}
.tier.exp{border-top-color:var(--red)} .tier.t10{border-top-color:#E4572E} .tier.t20{border-top-color:var(--orange)} .tier.t30{border-top-color:var(--yellow)}
.tier[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.card{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--yellow);
  border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;cursor:pointer}
.card.exp,.card.t10{border-left-color:var(--red)} .card.t20{border-left-color:var(--orange)} .card.t30{border-left-color:var(--yellow)}
.card .who{color:var(--muted)}
.card .tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.doc{display:inline-flex;gap:8px;align-items:baseline;border-radius:6px;padding:3px 10px;font-size:.92rem;background:var(--soon-bg)}
.doc.exp,.doc.t10{background:var(--exp-bg)}
.doc b{font-weight:600}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.boxed{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- danh sách xe ---------- */
.result{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soon-bg);border:1px solid var(--yellow-deep);
  border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.vrow{display:grid;grid-template-columns:140px 72px minmax(110px,1fr) 170px 128px 146px 166px 38px;gap:10px;align-items:center;
  padding:10px 14px 10px 16px;border-top:1px solid var(--line);cursor:pointer;box-shadow:inset 5px 0 0 var(--hc,transparent)}
.vrow:first-child{border-top:0}
.vrow:hover{background:var(--paper)}
.vrow.head{cursor:default;font-size:.82rem;color:var(--muted);font-weight:600;background:var(--paper)}
.vrow .lbl{display:none}
.vrow .st{font-size:.86rem}
.car{min-width:0}
.car small{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hang{font-weight:700}
.miss-n{display:inline-block;font-size:.76rem;font-weight:600;color:var(--amber);border:1px solid currentColor;border-radius:99px;padding:0 7px;margin-left:4px;white-space:nowrap}
.dash{color:var(--muted)}

/* ô chép được */
.cp{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:34px;padding:4px 8px;margin:-4px -8px;
  background:transparent;border:1px solid transparent;border-radius:6px;cursor:copy;text-align:left}
.cp:hover{background:var(--chip);border-color:var(--line)}
.cp .v{font-family:var(--mono);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp .ic{flex:none;width:15px;height:15px;opacity:.45}
.cp:hover .ic{opacity:.9}
.cp.done{background:var(--green);border-color:var(--green);color:#fff}
.cp.done .ic{opacity:1}
.cp.plate-cp{margin:0;padding:0;min-height:0;border:0}
.cp.plate-cp:hover{background:transparent}
.cp.plate-cp.done .plate{background:#D9F2E3}
.edit-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer}
.edit-btn:hover{border-color:var(--red);background:var(--exp-bg);color:var(--red)}
.edit-btn svg{width:17px;height:17px}
.act-list{display:grid;gap:10px;padding:18px 22px 22px}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);
  font-weight:600;cursor:pointer;text-align:left}
.act svg{width:20px;height:20px;flex:none}
.act:hover{border-color:var(--ink)}
.act.danger{color:var(--red)}
.act.danger:hover{border-color:var(--red)}
.act small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.btn.danger{background:var(--red);color:#fff}

@media (max-width:860px){
  .list{background:transparent;border:0;border-radius:0;overflow:visible}
  .vrow.head{display:none}
  .vrow{grid-template-columns:auto 1fr auto;gap:4px 10px;padding:14px;margin-bottom:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .vrow:first-child{border-top:1px solid var(--line)}
  .vrow{box-shadow:inset 6px 0 0 var(--hc,transparent);padding-left:18px}
  .vrow > .p{grid-column:1;grid-row:1}
  .vrow > .hang{grid-column:2;grid-row:1;justify-self:start}
  .vrow > .edit-btn{grid-column:3;grid-row:1}
  .vrow > .car{grid-column:1/-1;margin-bottom:6px}
  .vrow > .kv-m{grid-column:1/-1;display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px;
    border-top:1px dashed var(--line);padding-top:6px}
  .vrow .lbl{display:block;color:var(--muted);font-size:.85rem}
  .cp{margin:0;width:100%;justify-content:space-between;background:var(--chip);border-color:var(--line);min-height:40px;padding:6px 10px}
  .cp .v{font-size:1rem}
  .cp .ic{opacity:.7}
}

/* ---------- nút ---------- */
.btn{border:0;border-radius:8px;padding:11px 20px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--yellow)}
@media (prefers-color-scheme:dark){.btn.primary{background:var(--yellow);color:#1B2430}}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.9rem;background:var(--paper);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:progress}
.linklike{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer}

/* ---------- form ---------- */
form.vf{display:grid;gap:20px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 18px 18px;margin:0}
legend{font-weight:700;padding:0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field.wide{grid-column:1/-1}
.field label{font-size:.92rem;font-weight:500;display:flex;gap:8px;align-items:baseline}
.field label .req{color:var(--red)}
.field label .need{display:none;font-size:.78rem;font-weight:600;color:var(--amber)}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-height:44px}
.field.missing input,.field.missing select,.field.missing textarea{border:2px solid var(--yellow-deep);background:var(--miss-bg)}
.field.missing label .need{display:inline}
.field .hint{font-size:.82rem;color:var(--muted)}
.miss-note{background:var(--miss-bg);border:1px solid var(--yellow-deep);border-radius:var(--radius);padding:10px 14px;margin:0}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;padding:12px 0;background:var(--paper)}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:14px;padding:0;width:min(720px,94vw);max-height:90vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(16,24,32,.55)}
.dlg-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 22px 12px;border-bottom:1px solid var(--line);border-top:6px solid var(--yellow)}
.dlg-body{padding:8px 22px 20px;overflow:auto;max-height:calc(90vh - 160px)}
.dlg-body h3{font-size:1rem;margin:18px 0 6px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 12px;align-items:center}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.kv dd .cp{margin:0}
.kv dd.gap{color:var(--amber);font-weight:500}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 22px 18px;border-top:1px solid var(--line)}
#loginDlg{width:min(420px,92vw)}
.login{padding:24px}
.login h2{margin-bottom:6px}
.err{color:var(--red);font-size:.92rem;min-height:1.4em;margin:.5rem 0 0}

footer{max-width:1120px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;transition:.2s;pointer-events:none;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red);color:#fff}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

    ['bienSo', 'Biển số', { req: 1, ph: '63A-203.17', copy: 1 }],
    ['loaiXe', 'Loại xe', { list: 1 }],
    ['hangXe', 'Hãng xe', { list: 1 }],
    ['nhanHieu', 'Nhãn hiệu xe', { list: 1 }],
    ['namSX', 'Năm sản xuất', { mode: 'numeric' }],
    ['mauSon', 'Màu sơn', { list: 1 }],
    ['chucNang', 'Chức năng', { list: 1, ph: 'DAT, SH' }],
    ['soCavet', 'Số cà vẹt', { mode: 'numeric', copy: 1 }],
    ['soMay', 'Số máy', { copy: 1 }],
    ['soKhung', 'Số khung', { copy: 1 }],
  ]},
  { title: 'Kiểm định', fields: [
    ['soKiemDinh', 'Số chứng nhận kiểm định', { copy: 1 }],
    ['ngayKiemDinh', 'Ngày kiểm định', { type: 'date' }],
    ['hetHanKiemDinh', 'Ngày hết hạn kiểm định', { type: 'date' }],
  ]},
  { title: 'Giấy phép xe tập lái', fields: [
    ['soGPXTL', 'Số GPXTL', { ph: '2001/GPXTL-SXD', copy: 1 }],
    ['ngayCapGPXTL', 'Ngày cấp GPXTL', { type: 'date', copy: 1 }],
    ['hetHanGPXTL', 'Ngày hết hạn GPXTL', { type: 'date', hint: 'Để trống thì tự lấy theo hạn kiểm định.' }],
  ]},
  { title: 'Thiết bị DAT', fields: [
    ['seriDAT', 'Seri DAT', { copy: 1 }],
    ['imeiDAT', 'IMEI DAT', { mode: 'numeric', copy: 1 }],
  ]},
  { title: 'Chủ sở hữu', fields: [
    ['soHuu', 'Chủ sở hữu', { list: 1 }],
    ['ngayKyHD', 'Ngày kí hợp đồng thuê', { type: 'date' }],
    ['hetHanHD', 'Ngày hết hạn hợp đồng thuê', { type: 'date' }],
  ]},
  { title: 'Khác', fields: [
    ['daNhapSo', 'Nhập lên Sở', { select: [['Chưa nhập', 'Chưa nhập'], ['x', 'Đã nhập'], ['', 'Để trống']] }],
    ['note', 'Ghi chú', { wide: 1, textarea: 1 }],
  ]},
];
const ALL_FIELDS = GROUPS.flatMap(g => g.fields);
const OPT = Object.fromEntries(ALL_FIELDS.map(([k, , o]) => [k, o || {}]));
const DATE_KEYS = ALL_FIELDS.filter(f => f[2] && f[2].type === 'date').map(f => f[0]);

const state = { vehicles: [], q: '', hang: '', tier: '', editing: null, view: 'home', afterLogin: null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]/g, '');
const carName = v => [v.hangXe, v.nhanHieu].filter(Boolean).join(' ') || 'Chưa rõ loại xe';
const isMoto = v => MOTO_HANG.some(h => fold(h) === fold(v.hang));

/* ---------- thứ tự hạng theo bảng; màu theo hạng ---------- */
function hangOrder() {
  const seen = [];
  state.vehicles.forEach(v => { if (v.hang && !seen.includes(v.hang)) seen.push(v.hang); });
  return seen;
}
function hangColor(h) {
  if (HANG_COLORS[h]) return HANG_COLORS[h];
  const extra = hangOrder().filter(x => !HANG_COLORS[x]);
  return SPARE_COLORS[Math.max(0, extra.indexOf(h)) % SPARE_COLORS.length];
}
const hb = h => `<span class="hb" style="--hc:${hangColor(h)}">${esc(h)}</span>`;
function sortedVehicles() {
  const order = hangOrder();
  const rank = h => { const i = order.indexOf(h); return i === -1 ? 999 : i; };
  return [...state.vehicles].sort((a, b) => rank(a.hang) - rank(b.hang) || a.row - b.row);
}

/* ---------- ngày tháng & mức cảnh báo ---------- */
function parseDmy(s) {
  const m = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null;
}
const dmyToIso = s => { const m = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : ''; };
const isoToDmy = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
function daysLeft(s) {
  const d = parseDmy(s); if (!d) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((d - t) / 86400000);
}
function status(s) {
  const left = daysLeft(s);
  if (left === null) return { cls: 'none', left, text: '' };
  if (left < 0) return { cls: 'exp', left, text: `Quá hạn ${-left} ngày` };
  if (left === 0) return { cls: 'exp', left, text: 'Hết hạn hôm nay' };
  const t = TIERS.find(t => left <= t.max);
  return { cls: t ? t.cls : 'ok', left, text: `Còn ${left} ngày` };
}
const RANK = { exp: 0, t10: 1, t20: 2, t30: 3 };

/* ---------- thiếu thông tin ---------- */
const isThue = v => !!v.soHuu && fold(v.soHuu) !== 'trungtam';
const HD_KEYS = ['ngayKyHD', 'hetHanHD'];   // chỉ dùng cho xe thuê (chủ sở hữu không phải Trung tâm)
function toggleHD() {
  const show = isThue({ soHuu: $('#f-soHuu').value });
  HD_KEYS.forEach(k => { document.querySelector(`.field[data-field="${k}"]`).hidden = !show; });
}
function missingFields(v) {
  const keys = [...REQUIRED.tatCa];
  if (isThue(v)) keys.push(...REQUIRED.xeThue);
  return keys.filter(k => !String(v[k] ?? '').trim());
}

/* ---------- chép vào bộ nhớ tạm ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}
function flash(el) { el.classList.add('done'); setTimeout(() => el.classList.remove('done'), 1200); }
const cp = (val, cls = '') => val
  ? `<button type="button" class="cp ${cls}" data-copy="${esc(val)}" title="Bấm để chép"><span class="v">${esc(val)}</span><svg class="ic"><use href="#i-copy"/></svg></button>`
  : '<span class="dash">—</span>';
const plateCp = v => `<button type="button" class="cp plate-cp" data-copy="${esc(v.bienSo)}" title="Bấm để chép biển số"><span class="plate">${esc(v.bienSo)}</span></button>`;

document.addEventListener('click', async e => {
  const c = e.target.closest('[data-copy]');
  if (c) {
    e.stopPropagation();
    if (await copyText(c.dataset.copy)) { flash(c); toast('Đã chép: ' + c.dataset.copy); }
    return;
  }
  const pen = e.target.closest('[data-actions]');
  if (pen) {
    e.stopPropagation();
    const v = findRow(pen.dataset.actions); if (!v) return;
    requireAdmin(() => confirmDelete(v), `Nhập mật khẩu quản trị để xoá xe ${v.bienSo}.`);
    return;
  }
  const el = e.target.closest('.card[data-row], .vrow[data-row]');
  if (el) openDetail(+el.dataset.row);
}, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target.closest && e.target.closest('.card[data-row], .vrow[data-row]');
  if (el && e.target === el) openDetail(+el.dataset.row);
});

/* ---------- API ---------- */
async function api(payload, keyOverride) {
  const res = payload
    ? await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...payload, key: keyOverride ?? adminKey() }) })
    : await fetch(`${API_URL}?action=list`);
  const data = await res.json();
  if (!data.ok) {
    if (data.auth && keyOverride === undefined) { setAdmin(null); openLogin(null, 'Mật khẩu quản trị đã thay đổi, vui lòng nhập lại rồi lưu lần nữa.'); }
    throw new Error(data.error || 'Máy chủ không phản hồi.');
  }
  return data;
}

async function load(keepView) {
  $('#loading').hidden = false;
  try {
    const data = await api();
    state.vehicles = data.vehicles.filter(v => !isMoto(v));   // ẩn xe hạng A, A1
    buildDatalists();
    renderAll();
    if (!keepView) show(state.view);
  } catch (e) {
    toast('Không tải được danh sách: ' + e.message, true);
  } finally {
    $('#loading').hidden = true;
  }
}

/* ---------- quyền quản trị: hỏi mật khẩu khi thêm / sửa ---------- */
const adminKey = () => localStorage.getItem(ADMIN_STORE) || '';
const isAdmin = () => !!adminKey();
function setAdmin(key) {
  if (key) localStorage.setItem(ADMIN_STORE, key); else localStorage.removeItem(ADMIN_STORE);
  document.body.classList.toggle('is-admin', !!key);
}
function requireAdmin(action, msg) {
  if (isAdmin()) action(); else openLogin(action, msg);
}
function openLogin(after, msg) {
  state.afterLogin = after || null;
  $('#loginMsg').textContent = msg || 'Cần quyền quản trị để thêm hoặc chỉnh sửa xe.';
  $('#loginErr').textContent = '';
  $('#pw').value = '';
  $('#loginDlg').showModal();
  $('#pw').focus();
}
$('#loginCancel').addEventListener('click', () => $('#loginDlg').close());
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const key = $('#pw').value.trim();
  if (!key) { $('#loginErr').textContent = 'Nhập mật khẩu quản trị.'; return; }
  const btn = $('#loginSubmit'); btn.disabled = true; btn.textContent = 'Đang kiểm tra…';
  try {
    await api({ action: 'login' }, key);
    setAdmin(key);
    $('#loginDlg').close();
    const after = state.afterLogin; state.afterLogin = null;
    if (after) after();
  } catch (err) {
    $('#loginErr').textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Tiếp tục';
  }
});
$('#logoutBtn').addEventListener('click', () => { setAdmin(null); if (state.view === 'form') goHome(); toast('Đã thoát quyền quản trị.'); });
$('#addBtn').addEventListener('click', () => requireAdmin(() => { resetForm(); show('form'); }, 'Nhập mật khẩu quản trị để thêm xe mới.'));

/* ---------- điều hướng ---------- */
function show(view) {
  state.view = view;
  ['home', 'form'].forEach(v => { $('#view-' + v).hidden = v !== view; });
  document.body.classList.toggle('page-home', view === 'home');
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function goHome() { resetForm(); show('home'); }
$('#homeLink').addEventListener('click', goHome);
$('#logoLink').addEventListener('click', goHome);
$('#backHome').addEventListener('click', goHome);
$('#cancelEdit').addEventListener('click', goHome);

/* ---------- tra cứu ---------- */
$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  state.q = $('#q').value.trim();
  state.hang = '';
  renderSummary(); renderList();
  $('#sec-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('#q').addEventListener('input', e => { if (!e.target.value && state.q) { state.q = ''; renderList(); } });
function clearFilters() { state.q = ''; state.hang = ''; $('#q').value = ''; renderSummary(); renderList(); }

/* ---------- render ---------- */
function renderAll() { renderSummary(); renderAlerts(); renderList(); }

function renderSummary() {
  const order = hangOrder();
  const count = h => state.vehicles.filter(v => v.hang === h).length;
  $('#summary').innerHTML =
    `<button class="sum total" data-hang="" aria-pressed="${!state.hang}"><b>${state.vehicles.length}</b><span>Tổng xe</span></button>` +
    order.map(h => `<button class="sum h" style="--hc:${hangColor(h)}" data-hang="${esc(h)}" aria-pressed="${state.hang === h}"><b>${count(h)}</b><span>Hạng ${esc(h)}</span></button>`).join('');
}
$('#summary').addEventListener('click', e => {
  const b = e.target.closest('.sum'); if (!b) return;
  state.hang = state.hang === b.dataset.hang ? '' : b.dataset.hang;
  renderSummary(); renderList();
  $('#sec-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function renderAlerts() {
  const groups = [];
  state.vehicles.forEach(v => {
    const docs = EXPIRY.filter(f => f.key !== 'hetHanHD' || isThue(v))
      .map(f => ({ ...f, date: v[f.key], st: status(v[f.key]) })).filter(d => d.st.cls in RANK);
    if (docs.length) {
      docs.sort((a, b) => a.st.left - b.st.left);
      groups.push({ v, docs, worst: docs[0].st.cls, min: docs[0].st.left });
    }
  });
  groups.sort((a, b) => a.min - b.min);
  // mỗi giấy tờ chỉ thuộc đúng một ô: quá hạn / 0–10 / 11–20 / 21–30 ngày
  const inTier = (d, cls) => d.st.cls === cls;
  const counts = cls => groups.filter(g => g.docs.some(d => inTier(d, cls))).length;
  $('#tiers').innerHTML = [{ cls: 'exp', label: 'Đã quá hạn' }, ...TIERS]
    .map(t => `<button class="tier ${t.cls}" data-tier="${t.cls}" aria-pressed="${state.tier === t.cls}"><b>${counts(t.cls)}</b><span>${t.label}</span></button>`).join('');

  const shown = state.tier ? groups.filter(g => g.docs.some(d => inTier(d, state.tier))) : groups;
  if (!shown.length) {
    let next = null;
    state.vehicles.forEach(v => EXPIRY.forEach(f => {
      const l = daysLeft(v[f.key]);
      if (l !== null && l >= 0 && (!next || l < next.l)) next = { v, f, l };
    }));
    $('#alertList').innerHTML = `<div class="boxed empty">${state.tier ? 'Không có giấy tờ nào ở mốc này.' : `Không có xe nào hết hạn trong ${MAX_DAYS} ngày tới.`}${
      next && !state.tier ? `<br>Gần nhất: <span class="plate">${esc(next.v.bienSo)}</span>, ${next.f.label} hết hạn ${esc(next.v[next.f.key])} (còn ${next.l} ngày).` : ''}</div>`;
    return;
  }
  $('#alertList').innerHTML = shown.map(g => `
    <div class="card ${g.worst}" data-row="${g.v.row}" tabindex="0">
      <span class="plate">${esc(g.v.bienSo)}</span>
      <span class="who">${hb(g.v.hang)} ${esc(carName(g.v))}${g.v.soHuu ? ', ' + esc(g.v.soHuu) : ''}</span>
      <span class="tags">${g.docs.map(d => `<span class="doc ${d.st.cls}"><b>${d.label}</b> ${esc(d.date)} <span class="st ${d.st.cls}">${d.st.text}</span></span>`).join('')}</span>
    </div>`).join('');
}
$('#tiers').addEventListener('click', e => {
  const b = e.target.closest('.tier'); if (!b) return;
  state.tier = state.tier === b.dataset.tier ? '' : b.dataset.tier;
  renderAlerts();
});

function renderList() {
  const q = fold(state.q);
  const rows = sortedVehicles().filter(v =>
    (!state.hang || v.hang === state.hang) &&
    (!q || SEARCH_KEYS.some(k => fold(v[k]).includes(q))));

  $('#listTitle').textContent = state.hang ? `Danh sách xe hạng ${state.hang}` : 'Danh sách xe tập lái';
  const bar = $('#resultBar');
  if (state.q || state.hang) {
    bar.hidden = false;
    const what = [state.q && `tra cứu “<b>${esc(state.q)}</b>”`, state.hang && `hạng <b>${esc(state.hang)}</b>`].filter(Boolean).join(', ');
    bar.innerHTML = `<span>Đang lọc theo ${what}: <b>${rows.length}</b> xe</span>
      <button class="btn small" id="clearFilters">Xem toàn bộ danh sách</button>`;
    $('#clearFilters').onclick = clearFilters;
  } else bar.hidden = true;
  $('#resultCount').textContent = `${rows.length} / ${state.vehicles.length} xe`;

  if (!rows.length) {
    $('#vehicleList').innerHTML = `<div class="boxed empty">Không tìm thấy xe nào. Kiểm tra lại biển số, IMEI hoặc tên chủ xe; có thể chỉ nhập một phần, ví dụ “20317”.</div>`;
    return;
  }
  const expGP = v => {
    if (!v.hetHanGPXTL) return '<span class="dash">—</span>';
    const s = status(v.hetHanGPXTL);
    return `${cp(v.hetHanGPXTL)}${s.cls !== 'ok' ? `<span class="st ${s.cls}" style="display:block;margin-top:4px">${s.text}</span>` : ''}`;
  };
  $('#vehicleList').innerHTML = `
    <div class="vrow head"><span>Biển số</span><span>Hạng</span><span>Xe, chủ sở hữu</span><span>Số GPXTL</span><span>Ngày cấp</span><span>Hết hạn GPXTL</span><span>IMEI DAT</span><span></span></div>` +
    rows.map(v => {
      const m = missingFields(v).length;
      return `
    <div class="vrow" style="--hc:${hangColor(v.hang)}" data-row="${v.row}" tabindex="0">
      <span class="p">${plateCp(v)}</span>
      <span class="hang">${hb(v.hang)}</span>
      <span class="car">${esc(carName(v))}${m ? `<span class="miss-n">Thiếu ${m}</span>` : ''}
        <small>${esc(v.soHuu) || '&nbsp;'}</small></span>
      <span class="kv-m"><span class="lbl">Số GPXTL</span>${cp(v.soGPXTL)}</span>
      <span class="kv-m"><span class="lbl">Ngày cấp</span>${cp(v.ngayCapGPXTL)}</span>
      <span class="kv-m"><span class="lbl">Hết hạn GPXTL</span><span>${expGP(v)}</span></span>
      <span class="kv-m"><span class="lbl">IMEI DAT</span>${cp(v.imeiDAT)}</span>
      <button type="button" class="edit-btn" data-actions="${v.row}" title="Xoá xe khỏi web" aria-label="Xoá xe ${esc(v.bienSo)}"><svg><use href="#i-trash"/></svg></button>
    </div>`;
    }).join('');
}

/* ---------- chi tiết ---------- */
function findRow(row) { return state.vehicles.find(x => x.row === +row); }
function openDetail(row) {
  const v = findRow(row); if (!v) return;
  const miss = missingFields(v);
  const val = k => {
    if (!v[k]) return miss.includes(k) ? '<dd class="gap">Còn thiếu</dd>' : '<dd class="muted">—</dd>';
    if (EXPIRY.some(f => f.key === k)) { const s = status(v[k]); return `<dd>${esc(v[k])} <span class="st ${s.cls}">${s.text}</span></dd>`; }
    if (k === 'daNhapSo') return `<dd>${v.daNhapSo === 'x' ? 'Đã nhập' : esc(v.daNhapSo)}</dd>`;
    if (OPT[k].copy) return `<dd>${cp(v[k])}</dd>`;
    return `<dd>${esc(v[k])}</dd>`;
  };
  const dlg = $('#detail');
  dlg.innerHTML = `
    <div class="dlg-head">${plateCp(v).replace('class="plate"', 'class="plate big"')}
      <div><b>${esc(carName(v))}</b><br>${hb(v.hang)} <span class="muted">${miss.length ? `. Còn thiếu ${miss.length} mục` : ''}</span></div></div>
    <div class="dlg-body">${GROUPS.map(g => `
      <h3>${g.title}</h3>
      <dl class="kv">${g.fields.filter(f => f[0] !== 'bienSo' && (!HD_KEYS.includes(f[0]) || isThue(v))).map(([k, label]) => `<dt>${label}</dt>${val(k)}`).join('')}</dl>`).join('')}
    </div>
    <div class="dlg-foot">
      <button class="btn ghost" data-close>Đóng</button>
      <button class="btn primary" data-dlg-edit>${miss.length ? 'Bổ sung thông tin' : 'Chỉnh sửa'}</button>
    </div>`;
  dlg.querySelector('[data-close]').onclick = () => dlg.close();
  dlg.querySelector('[data-dlg-edit]').onclick = () => { dlg.close(); requireAdmin(() => startEdit(v), `Nhập mật khẩu quản trị để chỉnh sửa xe ${v.bienSo}.`); };
  dlg.showModal();
}
$('#detail').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* ---------- nút xoá: hỏi lại trước khi xoá (chỉ ẩn khỏi web) ---------- */
function confirmDelete(v) {
  const dlg = $('#actDlg');
  dlg.innerHTML = `
    <div class="dlg-head"><h2 style="font-size:1.2rem">Bạn có chắc muốn xoá xe <span class="plate">${esc(v.bienSo)}</span>?</h2></div>
    <div class="dlg-foot"><button class="btn ghost" data-a="close">Không</button><button class="btn danger" data-a="confirm">Xoá</button></div>`;
  dlg.onclick = async e => {
    if (e.target === dlg) { dlg.close(); return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'close') { dlg.close(); return; }
    a.disabled = true; a.textContent = 'Đang xoá…';
    try {
      await api({ action: 'hide', row: v.row, bienSo: v.bienSo });
      dlg.close();
      toast(`Đã xoá xe ${v.bienSo}.`);
      await load(true);
    } catch (err) {
      toast(err.message, true);
      a.disabled = false; a.textContent = 'Xoá';
    }
  };
  dlg.showModal();
}

/* ---------- form ---------- */
function buildForm() {
  $('#formGroups').innerHTML = GROUPS.map(g => `
    <fieldset><legend>${g.title}</legend><div class="grid">${g.fields.map(([k, label, o = {}]) => {
      const id = 'f-' + k;
      let input;
      if (o.select) input = `<select id="${id}" name="${k}">${o.select.map(([v, t]) => `<option value="${esc(v)}">${t}</option>`).join('')}</select>`;
      else if (o.textarea) input = `<textarea id="${id}" name="${k}" rows="2"></textarea>`;
      else input = `<input id="${id}" name="${k}" type="${o.type || 'text'}" ${o.list ? `list="dl-${k}"` : ''}
        ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${o.mode ? `inputmode="${o.mode}"` : ''} autocomplete="off">
        ${o.list ? `<datalist id="dl-${k}"></datalist>` : ''}`;
      return `<div class="field ${o.wide ? 'wide' : ''}" data-field="${k}"><label for="${id}">${label}${o.req ? ' <span class="req">*</span>' : ''}<span class="need">Còn thiếu</span></label>${input}
        ${o.hint ? `<span class="hint">${o.hint}</span>` : ''}</div>`;
    }).join('')}</div></fieldset>`).join('');

  $('#f-bienSo').addEventListener('blur', e => { e.target.value = e.target.value.trim().toUpperCase(); });
  $('#f-soHuu').addEventListener('input', toggleHD);
  $('#f-soHuu').addEventListener('change', toggleHD);
  $('#f-hetHanKiemDinh').addEventListener('change', e => { if (!$('#f-hetHanGPXTL').value) $('#f-hetHanGPXTL').value = e.target.value; });
  ['input', 'change'].forEach(ev => $('#vehicleForm').addEventListener(ev, () => { if (state.editing) markMissing(); }));
  resetForm();
}

function buildDatalists() {
  ALL_FIELDS.filter(f => f[2] && f[2].list).forEach(([k]) => {
    const vals = [...new Set(state.vehicles.map(v => v[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'vi'));
    const dl = document.getElementById('dl-' + k);
    if (dl) dl.innerHTML = vals.map(v => `<option value="${esc(v)}">`).join('');
  });
}

function readForm() {
  const data = {};
  for (const [k, v] of new FormData($('#vehicleForm')).entries()) data[k] = DATE_KEYS.includes(k) ? isoToDmy(v) : String(v).trim();
  data.bienSo = (data.bienSo || '').toUpperCase();
  return data;
}

function markMissing() {
  const miss = missingFields(readForm());
  document.querySelectorAll('.field[data-field]').forEach(f => f.classList.toggle('missing', miss.includes(f.dataset.field)));
  const note = $('#missNote');
  note.hidden = !miss.length;
  note.textContent = miss.length ? `Còn thiếu ${miss.length} mục, đã tô vàng bên dưới. Có thể lưu trước phần đã có, bổ sung phần còn lại sau.` : '';
  return miss;
}

function resetForm() {
  state.editing = null;
  $('#vehicleForm').reset();
  $('#f-soHuu').value = 'Trung tâm';
  $('#f-daNhapSo').value = 'Chưa nhập';
  toggleHD();
  document.querySelectorAll('.field.missing').forEach(f => f.classList.remove('missing'));
  $('#missNote').hidden = true;
  $('#formTitle').textContent = 'Thêm xe mới';
  $('#saveBtn').textContent = 'Thêm xe';
}

function startEdit(v) {
  resetForm();
  state.editing = { row: v.row, bienSo: v.bienSo };
  ALL_FIELDS.forEach(([k]) => {
    const el = document.getElementById('f-' + k); if (!el) return;
    el.value = DATE_KEYS.includes(k) ? dmyToIso(v[k]) : (v[k] ?? '');
  });
  toggleHD();
  const miss = markMissing();
  $('#formTitle').textContent = (miss.length ? 'Bổ sung thông tin xe ' : 'Chỉnh sửa xe ') + v.bienSo;
  $('#saveBtn').textContent = 'Lưu';
  show('form');
  const first = document.querySelector('.field.missing input, .field.missing select, .field.missing textarea');
  if (first) { first.scrollIntoView({ block: 'center' }); first.focus({ preventScroll: true }); }
}

$('#vehicleForm').addEventListener('submit', async e => {
  e.preventDefault();
  const data = readForm();
  if (!data.hetHanGPXTL && data.hetHanKiemDinh) data.hetHanGPXTL = data.hetHanKiemDinh;
  if (!data.hang) return fieldError('f-hang', 'Nhập hạng xe (A, A1, B, B.01, C1…).');
  if (!data.bienSo) return fieldError('f-bienSo', 'Nhập biển số xe.');
  const dup = state.vehicles.find(v => fold(v.bienSo) === fold(data.bienSo) && (!state.editing || v.row !== state.editing.row));
  if (dup) return fieldError('f-bienSo', `Biển số ${data.bienSo} đã có trong danh sách.`);

  const btn = $('#saveBtn'), oldLabel = btn.textContent;
  btn.disabled = true; btn.textContent = 'Đang lưu…';
  const editing = state.editing;
  try {
    if (editing) await api({ action: 'update', row: editing.row, bienSoCu: editing.bienSo, data });
    else await api({ action: 'add', data });
    toast(editing ? `Đã lưu thay đổi cho xe ${data.bienSo}` : `Đã thêm xe ${data.bienSo}`);
    await load(true);
    resetForm();
    show('home');
    $('#q').value = data.bienSo; state.q = data.bienSo; state.hang = '';
    renderSummary(); renderList();
    $('#sec-list').scrollIntoView({ block: 'start' });
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    if (btn.textContent === 'Đang lưu…') btn.textContent = oldLabel;
  }
});

function fieldError(id, msg) { toast(msg, true); document.getElementById(id).focus(); }

let toastTimer;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, bad ? 5000 : 2500);
}

/* ---------- khởi động ---------- */
buildForm();
setAdmin(adminKey() || null);
load();
</script>
</body>
</html>
